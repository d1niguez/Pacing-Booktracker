<!DOCTYPE html>

<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>


<body>
    <main class = 'signup-login'>
    <h2>Welcome Back</h2>
        
    {% with messages = get_flashed_messages() %}
    {% if messages %}
        {% for message in messages %}
            <p class="error">{{ message }}</p>
        {% endfor %}
    {% endif %}
{% endwith %}

    <p>The place to track your reading goals.</p>
<div class = 'add-book-form'>
    <form action = '/login' method="POST">
            <label for = 'email'>Email *</label>
            <input type = "email" id = "email" name = "email" required>

            <label for = "password">Password *</label>
            <input type = "password" id = "password" name = "password" required>

            <button type="submit" class="add-book-btn"> Log In</button>
            <a href="/signup" class="sidebar-btn" style="text-decoration: none;"> Don't have an account? Sign up</a>
    </form>
</div>
    </main>
</body>
</html>
