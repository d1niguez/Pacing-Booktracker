{% extends 'base.html' %}
{% block title %}Settings{% endblock %}

{% block content %}
<h1>Settings</h1>
<p>Review account settings here.</p>
<hr>

<div class="add-book-form">
    <form method="POST" action = "/settings">

        <label>Email</label>
        <input type="text" name="email" value="{{ current_user.email }}">

        <label>password</label>
        <input type="password" name="password">

        <button type="submit" class="settings-save-btn">Save</button>
    </form>

    <hr>

        <form action="/delete_account" method="POST" onsubmit = "return confirm('Are you sure you want to delete your account? This action cannot be undone!')">
            <button type="submit" class="settings-delete-btn">Delete Account</button>
        </form>
</div>
{% endblock %}
